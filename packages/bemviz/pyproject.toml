[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bemviz"
version = "0.1.0"
description = "Plotting and web export for bemkit BEM results"
readme = "README.md"
license = {text = "GPL-3.0-only"}
requires-python = ">=3.11"
dependencies = ["bemkit", "numpy", "matplotlib"]

[project.optional-dependencies]
viz3d = ["pyvista"]

[project.entry-points."bemkit.cli"]
bemviz = "bemviz:register_cli"

[tool.setuptools.packages.find]
include = ["bemviz*"]
