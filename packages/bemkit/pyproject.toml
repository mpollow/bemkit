[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bemkit"
version = "0.1.0"
description = "Modelling and results layer for NumCalc BEM simulations: meshing, fieldpoints, export, run orchestration"
readme = "README.md"
license = {text = "GPL-3.0-only"}
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "meshio",
    "pynumcalc",
]

[project.optional-dependencies]
# bemkit.view (the `geometry`/`results`/`export-web` verbs) is the only part
# that needs a display stack. It ships inside this distribution but its
# dependencies do not: `import bemkit` must stay numpy-light.
view = ["pyvista", "matplotlib"]
meshing = ["gmsh", "scipy"]
analytic = ["scipy"]
all = ["pyvista", "matplotlib", "gmsh", "scipy"]

[project.scripts]
bem = "bemkit.cli:main"

[tool.setuptools.packages.find]
include = ["bemkit*"]
